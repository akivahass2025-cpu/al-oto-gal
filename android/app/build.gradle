plugins {
    id 'com.android.application'
}

def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'io.github.akivahass.alotogal'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.akivahass.alotogal'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "1.${run}"
    }

    // One fixed key: every new build installs over the previous one and keeps the saved progress.
    signingConfigs {
        shared {
            storeFile file('../al-oto-gal.keystore')
            storePassword 'al-oto-gal-2026'
            keyAlias 'gal'
            keyPassword 'al-oto-gal-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
